name: lens sheet export

# Reads the user's lens spreadsheet (its sheet titles and the list of lenses on the first sheet) into
# the private data repo (lenses/sheet_export.json). Started by hand or by the maintainer; touches no sheet.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Export the lens sheet
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          LENS_SHEET_ID: ${{ secrets.LENS_SHEET_ID }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
        run: python -u -m tracker.lens_sheet
