name: catfirst threads

# catFirst, not the camera tracker: public Threads posts about cats by keyword, read logged out in
# headless Chromium, into the catFirst sheet (catfirst/threads.py). Once a day at 07:20 Berlin.
# GitHub's cron came 5-6 hours late or not at all, so the workflow keeps itself going: a run
# waits for the day's collection up to ~5.5 hours, then starts the next run. A manual start
# collects right away. The cron below only restarts a broken chain. Nothing is pushed; the logs
# hold counts only.
on:
  workflow_dispatch:
    inputs:
      chained:
        description: "Started by the previous run (internal)"
        type: boolean
        default: false
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: read
  actions: write  # start the next run

concurrency:
  group: catfirst-threads
  cancel-in-progress: false

jobs:
  collect:
    # pinned: ubuntu-latest became 26.04 on 2026-11-09, where Playwright 1.52 cannot install Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Mark the start
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt playwright==1.52.0
          python -m playwright install --with-deps chromium

      - name: Collect once a day
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          CATFIRST_SHEET_ID: ${{ secrets.CATFIRST_SHEET_ID }}
        run: python -u -m catfirst.threads --chain ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && '--now' || '' }}

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        # a run that ended within 10 minutes (a failed setup) does not hand over: no restart loop
        run: |
          if [ $(( $(date +%s) - STARTED )) -lt 600 ]; then echo "run ended within 10 minutes: not starting the next one"; exit 1; fi
          gh workflow run catfirst-threads.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f chained=true
