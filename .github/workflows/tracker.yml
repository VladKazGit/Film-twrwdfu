name: tracker

# A self-sustaining chain: each run ticks every 15 minutes (:07, :22, :37, :52
# Berlin, window 07:00-00:00) for up to 5.5 hours, then starts the next run.
# GitHub's cron is only a backup that restarts the chain if it broke.
#
# Start:  Actions -> tracker -> Run workflow (ticks right away, then chains).
# Stop:   set the repository variable TRACKER_ENABLED to "false" (the chain
#         ends after the current run), or cancel the running run (ends now).
on:
  schedule:
    - cron: "7 5-21/2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "First tick runs even outside the 07:00-00:00 Berlin window"
        type: boolean
        default: false
      chained:
        description: "Started by the previous run (internal)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # start the next run

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  tick:
    if: github.event_name == 'workflow_dispatch' || vars.TRACKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Ticks
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
        run: |
          echo "settings: chain ${{ vars.TRACKER_ENABLED == 'true' && 'on' || 'OFF (TRACKER_ENABLED is not true)' }}, event ${{ github.event_name }}, chained ${{ inputs.chained && 'yes' || 'no' }}"
          python -m tracker.loop ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && '--tick-now' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Start the next run
        if: ${{ !cancelled() && vars.TRACKER_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tracker.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f chained=true
