name: tracker

# A self-sustaining chain: each run ticks every 13-18 minutes at random (Berlin,
# window 07:00-00:00) for up to 5.5 hours, then starts the next run.
# GitHub's cron is only a backup that restarts the chain if it broke.
#
# Start:  Actions -> tracker -> Run workflow (ticks right away, then chains).
# Stop:   Actions -> tracker -> "..." -> Disable workflow (the chain ends after
#         the current run), and cancel the running run to stop right away.
# TRACKER_ENABLED=true (repository variable) only lets the backup cron start.
on:
  schedule:
    - cron: "7 5-21/2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "First tick runs even outside the 07:00-00:00 Berlin window"
        type: boolean
        default: false
      chained:
        description: "Started by the previous run (internal)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # start the next run

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  tick:
    if: github.event_name == 'workflow_dispatch' || vars.TRACKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-photos.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # Photo labeling of 'Остальные' (trial): CPU-only torch, CLIP and OCR. A failure here
      # only turns the photo step off; the tracker runs as before.
      - name: Install photo labeling
        continue-on-error: true
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements-photos.txt

      - name: Cache the photo model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-l-14-laion2b-s32b-b82k

      - name: Ticks
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          echo "settings: backup cron ${{ vars.TRACKER_ENABLED == 'true' && 'on' || 'off (TRACKER_ENABLED is not true)' }}, event ${{ github.event_name }}, chained ${{ inputs.chained && 'yes' || 'no' }}"
          python -u -m tracker.loop ${{ (github.event_name == 'workflow_dispatch' && !inputs.chained) && '--tick-now' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tracker.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f chained=true
