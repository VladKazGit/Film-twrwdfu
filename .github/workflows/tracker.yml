name: tracker

# Every 15 minutes, 05:00-22:59 UTC; the script itself keeps to the
# 07:00-00:00 Europe/Berlin window (summer and winter time).
# Scheduled runs only work while the repository variable TRACKER_ENABLED is
# "true" (Settings -> Secrets and variables -> Actions -> Variables).
on:
  schedule:
    - cron: "7,22,37,52 5-22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the 07:00-00:00 Berlin window"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  tick:
    if: github.event_name == 'workflow_dispatch' || vars.TRACKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Tick
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
        run: python -m tracker.tick ${{ inputs.force && '--force' || '' }}
